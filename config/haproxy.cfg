# Proxy HAProxy : point d'entrée unique du cluster, devant les 2 routeurs.
# Mode TCP : HAProxy ne lit pas le contenu des messages MongoDB, il relaie
# simplement les connexions vers un routeur qui fonctionne.

global
    log stdout format raw local0
    maxconn 4096

defaults
    mode tcp
    log global
    option tcplog
    timeout connect 5s
    timeout client  1h
    timeout server  1h

# Le DNS interne de Docker : permet de retrouver les routeurs par leur nom,
# même s'ils démarrent après le proxy.
resolvers docker
    nameserver dns 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry   1s
    hold valid 10s

# Port classique de MongoDB : c'est celui que le test utilise.
frontend entree_mongo
    bind :27017
    default_backend routeurs

backend routeurs
    balance roundrobin
    # check : vérifie toutes les 2 s que le routeur accepte les connexions
    # fall 2 / rise 2 : déclaré en panne après 2 échecs, rétabli après 2 réussites
    # init-addr libc,none : démarre même si le nom n'est pas encore résolu
    server routeur_1 routeur_1:27017 check inter 2s fall 2 rise 2 resolvers docker init-addr libc,none
    server routeur_2 routeur_2:27017 check inter 2s fall 2 rise 2 resolvers docker init-addr libc,none
